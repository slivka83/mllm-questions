name: sync-bridge
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "snapshot.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: зависимости
        run: pip install paho-mqtt

      - name: мост синка (дельты устройств → snapshot.json)
        run: python bridge/bridge.py

      - name: коммит snapshot.json
        run: |
          git config user.name "sync-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -m "snapshot refresh"
            git push
          fi
