name: sync-bridge-cron
# Отдельный файл только для расписания: GitHub иногда «залипает» на schedule
# в существующем workflow; новый файл регистрируется заново.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: зависимости
        run: pip install paho-mqtt

      - name: мост синка
        run: python bridge/bridge.py

      - name: коммит snapshot.json
        run: |
          git config user.name "sync-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -m "snapshot refresh"
            git push
          fi
